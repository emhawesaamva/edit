# Fork-only: runs the upstream CI checks (ci.yml) on pushes to feature branches,
# which ci.yml itself only does for main and pull requests to main.
# Unlike ci.yml, it also runs on macOS, the fork's main platform, so the pty end-to-end tests run there too.
name: Fork CI

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      # The Windows runners have autocrlf enabled by default.
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false
        if: matrix.os == 'windows-latest'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust
        run: rustup toolchain install nightly --no-self-update --profile minimal --component rust-src,rustfmt,clippy
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
      - name: Run tests
        run: cargo +nightly test --workspace
      - name: Run clippy
        run: cargo +nightly clippy --workspace --all-features --all-targets -- --no-deps --deny warnings
      - name: Run tests (stable)
        run: rustup toolchain install stable --no-self-update --profile minimal && cargo +stable test --workspace
